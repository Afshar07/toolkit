name: Publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out release tag and default-branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact-commit verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const { version } = JSON.parse(await readFile("package.json", "utf8"));
          const releaseVersion = process.env.RELEASE_TAG.replace(/^v/, "");
          if (releaseVersion !== version) {
            console.error(`Release tag does not match package.json version ${version}.`);
            process.exit(1);
          }
          NODE
      - run: npm run build
      - name: Pack exact release contents
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - name: Publish prepared tarball
        run: npm publish ./*.tgz --ignore-scripts
